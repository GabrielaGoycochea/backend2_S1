# Semana 5: integracion continua. En cada push o pull request se ejecutan las pruebas
# y la regla de cobertura de JaCoCo; si una prueba falla o la cobertura baja de 80 %, el check queda en rojo.
name: Pruebas PetSalud 

on:
  push:
    branches: [ "main", "Semana*", "semana*" ]
  pull_request:
    branches: [ "main", "Semana*", "semana*" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Las pruebas que levantan el contexto (contextLoads, rollback) necesitan una clave JWT en Base64.
      # Se genera una distinta en cada ejecucion: no es la de produccion y no queda guardada en el repositorio.
      - name: Generar JWT_SECRET temporal
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Ejecutar pruebas y verificar cobertura (mvn verify)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports

      - name: Publicar reportes de Failsafe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-failsafe
          path: target/failsafe-reports
