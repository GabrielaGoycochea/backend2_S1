spring.application.name=backendpetsalud
spring.datasource.url=jdbc:mysql://localhost:3307/petsalud_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# No exponer trazas ni detalles internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never

# Bloqueo temporal por intentos fallidos (fuerza bruta)
petsalud.seguridad.max-intentos-fallidos=5
petsalud.seguridad.minutos-bloqueo=15
