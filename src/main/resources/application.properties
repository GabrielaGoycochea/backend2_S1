spring.application.name=backendpetsalud
spring.datasource.url=jdbc:mysql://localhost:3307/petsalud_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.error.include-stacktrace=never
server.error.include-message=never

# JWT: clave HMAC en Base64 (minimo 256 bits), leida desde la variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET}
# Duracion del token: 15 minutos
jwt.expiration-ms=900000
jwt.issuer=PetSalud
# Semana 3: audiencia del token; se exige al validarlo junto con el emisor
jwt.audience=petsalud-api

# Bloqueo del login: 5 intentos fallidos -> bloqueo de 5 minutos
login.max-attempts=5
login.lock-minutes=5

# Semana 3: registro y monitoreo de actividad sospechosa (logger SEGURIDAD)
# Los eventos quedan en consola y en el archivo logs/petsalud.log (fecha, hora, IP, usuario y operacion)
logging.file.name=logs/petsalud.log
# Mas de 200 solicitudes desde una misma IP en 15 minutos se registra como RAFAGA_SOLICITUDES
seguridad.monitor.max-solicitudes=200
seguridad.monitor.ventana-minutos=15

# Semana 3: CORS. Solo estos front pueden llamar a la API desde un navegador (separados por coma)
cors.allowed-origins=http://localhost:3000,http://localhost:5173
